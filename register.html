<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container border p-4 rounded bg-white w-25 mx-auto" style="margin-top: 13%;">
    <h2 class="text-center mb-4">Register New Account</h2>
    <div class="mb-3 ">
      <input type="email" id="email" class="form-control" placeholder="Email" />
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Password" />
    </div>
    <div class="mb-3">
      <input type="password" id="confirm-password" class="form-control" placeholder="Confirm Password" />
    </div>
    <button id="register-btn" class="btn btn-success">Register</button>
    <p class="mt-3"><a href="index.html">Already have an account? Login</a></p>
  </div>

  <script type="module" src="register.js"></script>
</body>
</html>
